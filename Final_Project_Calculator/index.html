<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
  <link rel="stylesheet" href="style.css" />
  <title>Calculator App</title>
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <h1 class="logo">calc</h1>
      <div class="theme-toggle">
        <span>THEME</span>
        <div class="toggle-switch">
          <div class="toggle-labels">
            <span>1</span>
            <span>2</span>
            <span>3</span>
          </div>
          <div class="switch">
            <input type="range" min="1" max="3" value="1" id="theme-range" />
            <div class="slider"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="screen" id="display">0</div>

    <div class="keypad">
      <button class="key">7</button>
      <button class="key">8</button>
      <button class="key">9</button>
      <button class="key del">DEL</button>

      <button class="key">4</button>
      <button class="key">5</button>
      <button class="key">6</button>
      <button class="key">+</button>

      <button class="key">1</button>
      <button class="key">2</button>
      <button class="key">3</button>
      <button class="key">-</button>

      <button class="key">.</button>
      <button class="key">0</button>
      <button class="key">/</button>
      <button class="key">x</button>

      <button class="key reset span-2">RESET</button>
      <button class="key equal span-2">=</button>
    </div>
  </div>

  <div class="attribution">
    Challenge by ISTE-Aryan Mangla.
    Coded by <a href="#">Nehal Rai</a>.
  </div>

  <script src="script.js"></script>
</body>
</html>
